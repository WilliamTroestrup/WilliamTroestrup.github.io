<section id="contact" style="padding: 3rem 0;">
    <div class="container text-center">
      <h2 class="section-heading">Kontakt Friborgen</h2>
      <hr class="primary" style="width: 60px; margin: 1rem auto;">
      <p>Du er velkommen til at kontakte mig på Instagram, mail eller LinkedIn</p>
  
      <div class="contact-row">
        <div class="contact-box">
          <a href="mailto:{{ site.email }}">
            <i class="fa fa-envelope-o fa-3x"></i>
            <p>{{ site.email }}</p>
          </a>
        </div>
        <div class="contact-box">
          <a href="https://www.linkedin.com/in/christel-trostrup/?originalSubdomain=dk">
            <i class="fa fa-linkedin-square fa-3x"></i>
            <p>{{ site.linkedin_username }}</p>
          </a>
        </div>
        <div class="contact-box">
          <a href="https://www.instagram.com/friborgen_friborgen/">
            <i class="fa fa-instagram fa-3x"></i>
            <p>{{ site.insta_username }}</p>
          </a>
        </div>
      </div>
    </div>
  </section>
